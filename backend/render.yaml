services:
  - type: web
    name: talka-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./talka.db
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: UPLOAD_DIR
        value: ./uploads
      - key: OUTPUT_DIR
        value: ./outputs
      - key: MAX_VOICE_DURATION_SECONDS
        value: 300
      - key: MIN_VOICE_DURATION_SECONDS
        value: 60
    healthCheckPath: /health
    autoDeploy: true
